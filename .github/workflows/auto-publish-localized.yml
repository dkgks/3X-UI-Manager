name: Auto-publish localized release

# 每天检查一次上游 (yukh975/3X-UI-Manager) 是否有新的 release。
# 有：基于该版本代码应用 patches/ 下的补丁（简体中文汉化 + 更新源指向本 fork），构建 debug
# APK，发布到本 fork 的 GitHub Release（tag: localized-<上游tag>），可直接安装。
# 无：跳过。
# 补丁套不上（上游改了 i18n / 更新逻辑结构）：明确失败，人工更新 patches/ 下的补丁。

on:
  schedule:
    # 每天 UTC 00:00（约北京 08:00）检查一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 手动触发

permissions:
  contents: write  # push 分支、创建/更新 Release 与 tag

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out fork (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/yukh975/3X-UI-Manager.git
          git fetch upstream --tags --force

      - name: Detect latest upstream release tag
        id: uprel
        run: |
          TAG="$(gh api repos/yukh975/3X-UI-Manager/releases/latest --jq .tag_name 2>/dev/null || echo none)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Latest upstream release: $TAG"

      - name: Skip if this upstream version is already localized
        id: skipcheck
        if: steps.uprel.outputs.tag != 'none'
        run: |
          LOCAL_TAG="localized-${{ steps.uprel.outputs.tag }}"
          echo "local_tag=$LOCAL_TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$LOCAL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "already published locally — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not localized yet — will build."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 先备份补丁到工作树之外（/tmp），再切到上游 tag。因为 patches/ 只存在于
      # 本 fork，上游 tag 的工作树里没有它——切分支会把它冲掉。
      - name: Back up patches (outside the work tree)
        if: steps.uprel.outputs.tag != 'none' && steps.skipcheck.outputs.skip == 'false'
        run: |
          rm -rf /tmp/patches && mkdir -p /tmp/patches
          cp patches/*.patch /tmp/patches/
          ls -1 /tmp/patches/

      - name: Create localized branch from upstream tag
        if: steps.uprel.outputs.tag != 'none' && steps.skipcheck.outputs.skip == 'false'
        run: git switch -C "localized" "${{ steps.uprel.outputs.tag }}"

      - name: Apply fork patches (localization + update source)
        if: steps.uprel.outputs.tag != 'none' && steps.skipcheck.outputs.skip == 'false'
        run: |
          for p in /tmp/patches/*.patch; do
            echo "→ $(basename "$p")"
            git apply --check "$p" || { echo "::error::补丁 $(basename "$p") 无法套到上游 ${{ steps.uprel.outputs.tag }}（上游结构可能已变）。请人工更新 patches/ 下的补丁后再运行。"; exit 1; }
            git apply "$p"
          done
          git add -A
          git -c user.name="dkgks" -c user.email="51319264+dkgks@users.noreply.github.com" \
            commit -m "Apply fork patches (zh localization + updater) on ${{ steps.uprel.outputs.tag }}"

      - name: Push localized branch (so the tag can point at this commit)
        if: steps.uprel.outputs.tag != 'none' && steps.skipcheck.outputs.skip == 'false'
        run: git push --force-with-lease origin localized

      # 固定签名：用 Secrets 里的 debug keystore 盖掉 runner 上自动生成的那把（每台
      # 机器随机生成，会导致跨批次 APK 签名不同、应用内更新装不上）。
      # 三保险：写进 AGP 默认目录（$HOME/.android + ANDROID_USER_HOME/ANDROID_SDK_HOME
      # 指向的目录），再用 init script 把 debug 签名配置显式指向这份 keystore —— 不依赖
      # AGP 究竟从哪个目录取默认 keystore。
      - name: Install fixed debug keystore
        id: keyfix
        if: steps.uprel.outputs.tag != 'none' && steps.skipcheck.outputs.skip == 'false'
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/fixed-debug.keystore"
          chmod 600 "$RUNNER_TEMP/fixed-debug.keystore"
          for d in "$HOME/.android" "${ANDROID_USER_HOME:-$HOME}/.android" "${ANDROID_SDK_HOME:-$HOME}/.android"; do
            mkdir -p "$d"
            cp "$RUNNER_TEMP/fixed-debug.keystore" "$d/debug.keystore"
          done
          EXPECTED="$(keytool -exportcert -keystore "$RUNNER_TEMP/fixed-debug.keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)"
          echo "expected_cert=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "fixed keystore cert sha256: $EXPECTED"
          env | grep -i '^ANDROID' | sort || true
          cat > "$RUNNER_TEMP/fixed-signing.gradle" <<'GRADLE'
          allprojects {
              plugins.withId('com.android.application') {
                  android {
                      signingConfigs {
                          debug {
                              storeFile = new File(System.getenv('FIXED_DEBUG_KEYSTORE'))
                              storePassword = 'android'
                              keyAlias = 'androiddebugkey'
                              keyPassword = 'android'
                          }
                      }
                  }
              }
          }
          GRADLE

      - name: Install Android SDK (platform 35 + build-tools 35.0.0)
        if: steps.uprel.outputs.tag != 'none' && steps.skipcheck.outputs.skip == 'false'
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o /tmp/cmdline.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        if: steps.uprel.outputs.tag != 'none' && steps.skipcheck.outputs.skip == 'false'
        env:
          FIXED_DEBUG_KEYSTORE: ${{ runner.temp }}/fixed-debug.keystore
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          gradle --no-daemon --stacktrace \
            --init-script "$RUNNER_TEMP/fixed-signing.gradle" \
            assembleStandardDebug

      # 签名必须是那把固定 keystore，否则各批次 APK 互相装不上（应用内更新会失败）。
      # 不一致就明确失败，不发半成品。
      - name: Verify APK signing key
        if: steps.uprel.outputs.tag != 'none' && steps.skipcheck.outputs.skip == 'false'
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/standard/debug/*.apk | head -1)"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee /tmp/apk-certs.txt
          ACTUAL="$(grep -i 'certificate SHA-256 digest' /tmp/apk-certs.txt | head -1 | sed 's/.*digest: *//' | tr -d ':' | tr 'A-F' 'a-f')"
          EXPECTED="${{ steps.keyfix.outputs.expected_cert }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK 签名证书与固定 keystore 不一致（actual=$ACTUAL expected=$EXPECTED），应用内更新会装不上。"
            exit 1
          fi
          echo "签名校验通过: $ACTUAL"

      - name: Publish GitHub Release (localized)
        if: steps.uprel.outputs.tag != 'none' && steps.skipcheck.outputs.skip == 'false'
        run: |
          LOCAL_TAG="${{ steps.skipcheck.outputs.local_tag }}"
          APK="$(ls app/build/outputs/apk/standard/debug/*.apk | head -1)"
          UP_TAG="${{ steps.uprel.outputs.tag }}"
          V="${UP_TAG#v}"
          gh release create "$LOCAL_TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target localized \
            --title "本地化版 $V（含简体中文）" \
            --notes "基于上游 **$UP_TAG** 构建：应用简体中文汉化补丁，并把应用内「检查更新」指向本仓库。Debug 自动签名，可直接安装。上游更新日志见 [CHANGELOG](https://github.com/yukh975/3X-UI-Manager/blob/$UP_TAG/CHANGELOG.md)。"
          echo "Published $LOCAL_TAG"
